<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#d9d2c5">
<title>Talker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="stage.css?v=1.56.3">
<style>
  /* each object's word, under its pad */
  .label { position: fixed; transform: translate(-50%, 0); white-space: nowrap; pointer-events: none;
           font: 700 clamp(18px, 4.2dvh, 40px)/1 system-ui, -apple-system, sans-serif; color: #45506a; letter-spacing: .03em;
           opacity: 0; transition: opacity .8s ease; }
  .label.on { opacity: 1; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<a id="home" href="./" aria-label="Choose a game"><svg viewBox="0 0 64 64" width="46" height="46" aria-hidden="true"><rect x="15" y="29" width="34" height="25" rx="3" fill="#f6e6c6" stroke="#b98d5e" stroke-width="2.5"/><path d="M8 32 L32 11 L56 32" fill="#e98a6b" stroke="#c4664b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="13" width="7" height="11" rx="1.5" fill="#c4664b"/><rect x="27" y="38" width="11" height="16" rx="5.5" fill="#7fa7c9"/><circle cx="35" cy="47" r="1.3" fill="#f6e6c6"/><rect x="19" y="35" width="6" height="6" rx="1.2" fill="#ffe9a8" stroke="#b98d5e" stroke-width="1.5"/></svg></a>
<button id="gear" class="btn" aria-label="Grown-ups: press and hold">⚙</button>
<button id="case" class="btn" aria-label="Capitals or small letters">ABC</button>
<button id="sound" class="btn" aria-label="Sound on or off">🔊</button>
<button id="full" class="btn" aria-label="Full screen">⛶</button>
<div id="panel" hidden></div>
<div id="ver">v1.56.3</div>
<script>
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => { if (!e.target.closest('#panel')) e.preventDefault(); }, { passive: false });
</script>
<script type="module" src="talk.js?v=1.56.3"></script>
</body>
</html>

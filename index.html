<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#d9d2c5">
<title>Mystery Box</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d2c5; overscroll-behavior: none;
         -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  main { height: 100dvh; display: flex; align-items: center; justify-content: center; gap: 5vw; padding: 0 4vw; box-sizing: border-box; }
  /* one big card per game: a picture of it and its name */
  a.game { display: flex; flex-direction: column; align-items: center; gap: 2.2dvh; text-decoration: none; color: #45506a;
           background: rgba(255,255,255,.4); border-radius: 28px; padding: 2.5dvh 2.5dvh 3dvh; box-shadow: 0 6px 22px rgba(80,70,50,.12);
           transition: transform .5s ease; }
  a.game:active { transform: scale(.97); }
  a.game img { display: block; width: min(38vw, 50dvh * 1.44); aspect-ratio: 1.44; object-fit: cover; border-radius: 18px; }
  a.game span { font: 700 clamp(28px, 7dvh, 60px)/1 system-ui, -apple-system, sans-serif; letter-spacing: .03em; }
  #ver { position: fixed; right: 10px; bottom: 6px; font: 11px system-ui, sans-serif; color: #8d8577; pointer-events: none; }
</style>
</head>
<body>
<main>
  <a class="game" href="letters.html"><img src="assets/splash/letters.jpg?v=1.52.0" alt=""><span>Letters</span></a>
  <a class="game" href="words.html"><img src="assets/splash/words.jpg?v=1.52.0" alt=""><span>Words</span></a>
</main>
<div id="ver">v1.52.0</div>
<script>
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
